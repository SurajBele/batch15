apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deploy
  labels:
    app: my-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-deploy-pod
  template:
    metadata:
      name: my-deploy-pod
      labels:
        app: my-deploy-pod
        env: devops
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
          - name: http
            containerPort: 80