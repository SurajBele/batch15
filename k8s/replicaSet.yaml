apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: my-rset
  labels:
    app: my-replica
  Namespace:
    name: mywork
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-app2
    matchExpressions:
      - {key: app, operator: In, values: [my-app2, my-app3] }
  template:
    metadata:
      name: my-pod2
      labels:
        app: my-app2
        env: devops
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
          - name: http
            containerPort: 80
...
---
apiVersion: v1
kind: Service
metadata:
  name: my-svc-node
  labels:
    app: my-svc-node
    env: devops
spec:
  type: NodePort
  selector:
    app: my-app2
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
...
