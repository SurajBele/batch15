apiVersion: apps/v1
kind: statefulSet
metadata:
  name: my-state
  labels:
    app: my-state
spec:
  strategy: 
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 1
  selector:
    matchLabels:
      app: my-state
  template:
    metadata:
      name: my-state
      labels:
        app: my-state
        env: devops
    spec:
      containers:
        - name: my-web
          image: mariadb
          ports:
          - name: dbport
            containerPort: 3306
          env:
          - name: APP-NAME
            value: myapp
          - name: ROOT_PASSWORD
            valueFrom:
              ConfigMapKeyRef:
                name: my-variables
                key: password