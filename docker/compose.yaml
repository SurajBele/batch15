services:
  webserver:
    image: surajbele/batch19:apache2
    ports:
      - 80:80
    volumes:
      - /opt/data:/var/www/html
  tomserver:
    image: surajbele/batch19:tomcatv1
    ports:
      - 8080:8080
    environment: 
      department: "devops"
  database:
    image: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: admin123 

